# EXP-06 spatial split — A0 vs A1 + McNemar
input: data/datos_wifi_curated_anon.parquet
graph_dir: data/graphs/physical
output_dir: experiments/outputs/gnn/pignn/spatial

split: spatial
save_predictions: true
mcnemar_pair: [A0, A1]

spatial:
  state: Chiapas
  train_municipalities:
    - Tuxtla Gutiérrez
    - Suchiapa
    - Chiapa de Corzo
    - Jardines del Grijalva
  val_municipalities:
    - Las Flechas

model: sage
features: graph
subgraph: non_isolate
edge_mode: train
edge_weight: combined

epochs: 200
patience: 20
lr: 0.001
hidden: 64
seed: 42

variants:
  A0:
    lambda_physics: 0.0
    lambda_smooth: 0.0
    note: GNN base (spatial hold-out)
  A1:
    lambda_physics: 0.1
    lambda_smooth: 0.0
    note: Physics-only PI-GNN (spatial hold-out)
