# EXP-06 Spatial Gate — LOO-best variant
# P3 selected by LOO (lambda1=0.3, lambda2=0.01)
input: data/datos_wifi_curated_anon.parquet
graph_dir: data/graphs/physical
output_dir: experiments/outputs/gnn/pignn/spatial_gate

split: spatial
save_predictions: true
evaluate_gate: true
gate_baseline: A0

spatial:
  state: Chiapas
  train_municipalities:
    - Tuxtla Gutiérrez
    - Suchiapa
    - Chiapa de Corzo
    - Jardines del Grijalva
  val_municipalities:
    - Las Flechas

model: sage
features: graph
subgraph: non_isolate
edge_mode: train
edge_weight: combined

epochs: 200
patience: 20
lr: 0.001
hidden: 64
seed: 42

variants:
  P3_loo:
    lambda_physics: 0.3
    lambda_smooth: 0.01
    loss_variant:
      physics_loss: huber
